services:
  - name: knowledgerag
    type: web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Same Supabase project the app already uses locally — not secret (RLS-protected URL).
      - key: SUPABASE_URL
        value: https://lpiqkhwzvakhuanogwvj.supabase.co
      - key: VITE_SUPABASE_URL
        value: https://lpiqkhwzvakhuanogwvj.supabase.co

      # Secrets — Render will prompt you for these once when the blueprint is created.
      # Copy the values straight from your local .env file.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false

      # Runtime config — matches what's already running locally (Groq LLM + HuggingFace embeddings).
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: EMBEDDING_PROVIDER
        value: huggingface
      - key: EMBEDDING_DIMENSIONS
        value: "768"

      # Single-container deploy: frontend calls the API on the same origin.
      - key: VITE_API_URL
        value: ""
      - key: CORS_ORIGINS
        value: "*"
